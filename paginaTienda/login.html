<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/loginStyles2.css" />
    <title>Login | Register</title>
  </head>
  <body>

    <header></header>

    <main>
      <section class="customer-area">
        <article>
          <p>Customer Area</p>
          <h1>My account</h1>
          <p>
            Log in or create an account to manage your orders.
          </p>
        </article>
      </section>

      <section class="card">
        <article class="top-card">
          <button type="button" id="button_login"><span>Login</span></button>
          <button type="button" id="button_create"><span>Create Account</span></button>
        </article>

        <article class="forms">
          <form class="form-login">
            <h2>Welcome back!</h2>

            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="Enter your email" />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" />

            <input type="submit" value="Login" id="loginButton" />
          </form>

          <form class="form-register">
            <h2>Start your journey</h2>

            <label for="register-name">Name</label>
            <input type="text" id="register-name" name="name" />

            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" />

            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" />

            <input type="submit" value="Sign Up" id="registerButton" />
          </form>

          <img class="cover-image" src="IMG/icons/imagen-login.png" alt="" />
        </article>

        <p>By using this software...</p>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
